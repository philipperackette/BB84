<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Advanced BB84 Simulator</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #FAFAFA;
      color: #333;
    }

    h1 {
      margin: 10px;
      font-size: 1.5em;
    }

    /* Main container with two columns */
    #main-container {
      display: flex;
      flex-direction: row;
      height: calc(100vh - 60px); /* Adjust if needed */
    }

    /* Left panel: contains controls, rows (Alice, Bob, etc.), and console */
    #left-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px;
      overflow-y: auto; /* If content exceeds, vertical scrollbar */
    }

    /* Right panel: stats and final key */
    #right-panel {
      width: 350px;
      border-left: 1px solid #CCC;
      padding: 10px;
      overflow-y: auto; /* If needed */
    }

    /* Controls section (number of photons, button, etc.) */
    #controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 10px;
      background: #FFF;
      padding: 10px;
      border: 1px solid #CCC;
      border-radius: 5px;
    }
    #controls label {
      margin-right: 5px;
      font-weight: bold;
      font-size: 0.9em;
    }
    #controls input[type="number"] {
      width: 70px;
      margin-right: 10px;
    }
    #controls input[type="checkbox"] {
      margin-left: 10px;
      margin-right: 5px;
    }
    #controls .slider-container {
      display: flex;
      align-items: center;
      margin-left: 10px;
    }
    #controls .slider-container[hidden] {
      display: none;
    }
    #controls input[type="range"] {
      margin: 0 5px;
    }
    #controls button {
      margin-left: 10px;
      padding: 5px 15px;
      cursor: pointer;
    }

    /* Title of a "row" (e.g., Alice, Bob, etc.) */
    .row {
      margin-bottom: 10px;
    }
    .row-title {
      font-weight: bold;
      width: 80px;
      font-size: 1em;
      margin-bottom: 5px;
    }

    /* Scrollable horizontal container for "photons" */
    .row-container {
      border: 1px solid #CCC;
      border-radius: 5px;
      padding: 5px;
      overflow-x: auto; 
      white-space: nowrap; /* to force inline display */
      background-color: #FFF;
      min-height: 60px;
    }

    /* Small block representing a column (base + state) for each photon */
    .photon-box {
      display: inline-block;
      width: 40px;    /* Fixed width for each photon */
      text-align: center;
      margin: 0 2px;
    }
    .basis-label {
      font-size: 10px;
      line-height: 12px;
    }
    .state-label {
      font-size: 14px;
      font-weight: bold;
      line-height: 18px;
    }

    /* Console / log */
    #console {
      margin-top: 10px;
    }
    #log-label {
      font-style: italic;
      margin-bottom: 5px;
    }
    /* Remplacement de la textarea par un div avec style approprié */
    #log {
      width: 100%;
      height: 200px;
      background: #F0F0F0;
      border: 1px solid #CCC;
      border-radius: 5px;
      padding: 5px;
      font-size: 0.85em;
      overflow-y: auto; /* Ajouté pour le défilement vertical */
      white-space: pre-wrap; /* Pour conserver les sauts de ligne */
      font-family: monospace; /* Optionnel : police à chasse fixe */
      overflow-wrap: anywhere;
      box-sizing: border-box;
    }

    /* Right panel: Stats and Final Key */
    #right-panel h2 {
      margin-top: 0;
      font-size: 1.1em;
    }
    #stats, #finalKey {
      width: 100%;
      background: #F0F0F0;
      border: 1px solid #CCC;
      border-radius: 5px;
      min-height: 50px;
      padding: 5px;
      font-size: 0.9em;
      white-space: pre-wrap; /* to allow line breaks */
      overflow-wrap: anywhere; /* long keys wrap inside the panel */
      box-sizing: border-box;
      margin-bottom: 15px;
    }

    /* Some colors (similar to those in the Python script) */
    .color-Z { color: #1E90FF; }  /* Dodger Blue */
    .color-X { color: #FF8C00; }  /* Dark Orange */
    .color-empty { color: #808080; } /* Gray */
    .color-check { color: #1A8F2E; } /* ✓ Green */
    .color-cross { color: #D32F2F; } /* ✗ Red */
    .color-mismatch { color: #D32F2F; text-decoration: underline; }

    #log .log-step { font-weight: bold; }
    #log hr { border: none; border-top: 1px solid #CCC; margin: 4px 0; }

    .stats-ok { color: #1A8F2E; }
    .stats-alert { color: #D32F2F; }

    #legend {
      font-size: 0.85em;
      background: #FFF;
      border: 1px solid #CCC;
      border-radius: 5px;
      padding: 5px 10px;
      margin-bottom: 15px;
      line-height: 1.6;
    }

    /* Narrow screens: stack the two panels */
    @media (max-width: 800px) {
      #main-container {
        flex-direction: column;
        height: auto;
      }
      #right-panel {
        width: auto;
        border-left: none;
        border-top: 1px solid #CCC;
      }
      #controls button {
        margin: 8px 0 0;
      }
    }
    /* Header with language switch */
    #page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-right: 10px;
    }
    #lang-switch {
      display: inline-flex;
      border: 1px solid #CCC;
      border-radius: 5px;
      overflow: hidden;
      flex-shrink: 0;
    }
    #lang-switch button {
      border: none;
      background: #FFF;
      padding: 5px 12px;
      cursor: pointer;
      font-weight: bold;
      color: #555;
    }
    #lang-switch button + button {
      border-left: 1px solid #CCC;
    }
    #lang-switch button[aria-pressed="true"] {
      background: #1E90FF;
      color: #FFF;
    }
  </style>
</head>
<body>

  <header id="page-header">
    <h1 data-i18n="title">Advanced BB84 Simulator</h1>
    <div id="lang-switch" role="group" aria-label="Language / Langue">
      <button type="button" data-lang="fr" lang="fr">FR</button>
      <button type="button" data-lang="en" lang="en">EN</button>
    </div>
  </header>

  <div id="main-container">
    
    <!-- Left panel (controls, rows, console) -->
    <div id="left-panel">
      <!-- Controls -->
      <div id="controls">
        <label for="nQubits" data-i18n="nPhotons">Number of photons:</label>
        <input type="number" id="nQubits" min="20" max="500" value="50" />

        <input type="checkbox" id="eveActive" />
        <label for="eveActive" data-i18n="enableEve">Enable Eve</label>

        <div class="slider-container" id="eveProbContainer" hidden>
          <label for="eveProb" data-i18n="interceptProb">Interception probability:</label>
          <input type="range" id="eveProb" min="0" max="100" step="5" value="100" />
          <span id="eveProbLabel">100%</span>
        </div>

        <button id="startBtn" data-i18n="start">Start</button>
      </div>

      <!-- Alice -->
      <div class="row" id="rowAlice">
        <div class="row-title">Alice</div>
        <div class="row-container" id="rowAliceContainer"></div>
      </div>
      <hr />
      <!-- Eve -->
      <div class="row" id="rowEve">
        <div class="row-title">Eve</div>
        <div class="row-container" id="rowEveContainer"></div>
      </div>
      <hr />
      <!-- Bob -->
      <div class="row" id="rowBob">
        <div class="row-title">Bob</div>
        <div class="row-container" id="rowBobContainer"></div>
      </div>
      <hr />
      <!-- Sifting -->
      <div class="row" id="rowCrible">
        <div class="row-title" data-i18n="rowSifting">Sifting</div>
        <div class="row-container" id="rowCribleContainer"></div>
      </div>
      <hr />
      <!-- Key -->
      <div class="row" id="rowKey">
        <div class="row-title" data-i18n="rowKey">Key</div>
        <div class="row-container" id="rowKeyContainer"></div>
      </div>
      <hr />

      <!-- Console / Event Log -->
      <div id="console">
        <div id="log-label" data-i18n="logLabel">Console / Event Log:</div>
        <div id="log"></div>
      </div>
    </div>

    <!-- Right panel (Statistics, Final Key) -->
    <div id="right-panel">
      <h2 data-i18n="statsTitle">Statistics</h2>
      <div id="stats"></div>

      <h2 data-i18n="keyTitle">Final Key</h2>
      <div id="finalKey"></div>

      <h2 data-i18n="legendTitle">Legend</h2>
      <div id="legend">
        <div data-i18n-html="legend"></div>
        <!-- Affiché seulement si la clé contient des bits différents -->
        <div id="legendMismatch" data-i18n-html="legendMismatch" hidden></div>
      </div>
    </div>

  </div>

  <script>
    /***************************************************
     * Traductions (FR / EN)
     ***************************************************/
    const I18N = {
      en: {
        pageTitle: "Advanced BB84 Simulator",
        title: "Advanced BB84 Simulator",
        nPhotons: "Number of photons:",
        enableEve: "Enable Eve",
        interceptProb: "Interception probability:",
        start: "Start",
        rowSifting: "Sifting",
        rowKey: "Key",
        logLabel: "Console / Event Log:",
        statsTitle: "Statistics",
        keyTitle: "Final Key",
        legendTitle: "Legend",
        legend:
          '<span class="color-Z">Z</span> basis: <span class="color-Z">↑</span> = 0, <span class="color-Z">→</span> = 1<br />' +
          '<span class="color-X">X</span> basis: <span class="color-X">↗</span> = 0, <span class="color-X">↘</span> = 1<br />' +
          'Sifting: <span class="color-check">✓</span> / <span class="color-cross">✗</span> = sampled control bit (match / error), ' +
          '0 / 1 = kept for the key, ? = bases differ (discarded)',
        legendMismatch:
          'Key: <span class="color-mismatch">underlined red</span> = Bob\'s bit differs from Alice\'s',
        photon: (p) => `Photon ${p.i}`,
        badCount: "The number of photons must be between 20 and 500.",

        step1: "Step 1: Alice randomly chooses filters.",
        aliceFilters: (p) => `   Alice's filters: ${p.list}`,
        step2: "Step 2: Alice randomly chooses bits.",
        aliceBits: (p) => `   Alice's bits: ${p.list}`,
        step3: "Step 3: Alice encodes bits into quantum states.",
        aliceStates: (p) => `   Alice's quantum states: ${p.list}`,
        step4: "Step 4: Bob randomly chooses filters.",
        bobFilters: (p) => `   Bob's filters: ${p.list}`,
        step5: "Step 5: Eve intercepts photons (if Eve is eavesdropping).",
        eveProb: (p) => `   Interception probability: ${p.prob}%`,
        evePhoton: (p) => `   Photon ${p.i}: Eve's basis ${p.basis}` +
          (p.same ? " (same as Alice)" : " (wrong basis, random result)") +
          `, measured bit ${p.bit}, re-emitted state ${p.state}`,
        eveTotal: (p) => `   Total photons intercepted by Eve: ${p.count}`,
        eveOff: "   Eve is not enabled. No photons intercepted.",
        step6: "Step 6: Bob measures the received photons.",
        bobStates: (p) => `   Bob's measured states: ${p.list}`,
        step7: "Step 7: Alice and Bob publicly compare their filters and keep the common ones.",
        common: (p) => `   Common indices: ${p.list}`,
        step8: "Step 8: Selecting a sample to evaluate the error rate.",
        sampled: (p) => `   Sampled indices: ${p.list}`,
        noSample: "   Not enough common filters for a significant sample.",
        step9: "Step 9: Comparing control bits.",
        ctrlError: (p) => `   Error detected at photon ${p.i}. (Alice=${p.a}, Bob=${p.b})`,
        ctrlOk: (p) => `   No error at photon ${p.i}. (Alice=${p.a}, Bob=${p.b})`,
        siftResults: (p) => `   Sifting results: ${p.list}`,
        step10: "Step 10: Calculating the error rate.",
        errorRate: (p) => `   Error rate: ${pct(p.rate)} (${p.errors}/${p.sample})`,
        step11: "Step 11: Assessing the confidence of the connection.",
        noCtrl: "   No control bits: the channel cannot be checked. Exchange aborted.",
        abort: () => `   Error rate above ${pct(QBER_THRESHOLD, 0)}: eavesdropping suspected. Exchange aborted.`,
        secureMsg: "   Acceptable error rate. Connection considered secure.",
        step12: "Step 12: Generating the secret key.",
        aliceKey: (p) => `   Alice's key: ${p.key} (${p.len} bits)`,
        bobKey: (p) => `   Bob's key:   ${p.key} (${p.diff} differing bit(s))`,
        noKey: "   No key generated.",
        completed: "Simulation completed.",

        sPhotons: (r) => `Photons generated: ${r.n}`,
        sSifted: (r) => `Photons kept after sifting: ${r.sifted} (${pct(r.sifted/r.n)})`,
        sSample: (r) => `Control bits sampled: ${r.sampleSize}`,
        sQber: (r) => `Measured error rate (QBER): ${pct(r.errorRate)}`,
        sThreshold: () => `Abort threshold: ${pct(QBER_THRESHOLD)}`,
        sIntercepted: (r) => `Photons intercepted by Eve: ${r.intercepted} (${pct(r.intercepted/r.n)})`,
        sExpected: (r) => `Expected QBER caused by Eve: ≈ ${pct(r.eveProb/4)}`,
        sAccepted: "Error rate acceptable: key accepted.",
        sRejected: "Error rate too high: eavesdropping suspected, key discarded.",

        kAborted: "No key: the exchange was aborted.",
        kLength: (r) => `Length: ${r.aliceKey.length} bits`,
        kAlice: "Alice:",
        kBob: "Bob:  ",
        kDiff: (r) => `Bits that differ: ${r.keyMismatches}`,
        kDiffNote: " (to be fixed by error correction, then privacy amplification)",
        kEve: (r) => `Key bits Eve knows exactly: ${r.eveKnown} / ${r.aliceKey.length}`
      },

      fr: {
        pageTitle: "Simulateur BB84 avancé",
        title: "Simulateur BB84 avancé",
        nPhotons: "Nombre de photons :",
        enableEve: "Activer Eve",
        interceptProb: "Probabilité d'interception :",
        start: "Démarrer",
        rowSifting: "Tamisage",
        rowKey: "Clé",
        logLabel: "Console / Journal des événements :",
        statsTitle: "Statistiques",
        keyTitle: "Clé finale",
        legendTitle: "Légende",
        legend:
          'Base <span class="color-Z">Z</span> : <span class="color-Z">↑</span> = 0, <span class="color-Z">→</span> = 1<br />' +
          'Base <span class="color-X">X</span> : <span class="color-X">↗</span> = 0, <span class="color-X">↘</span> = 1<br />' +
          'Tamisage : <span class="color-check">✓</span> / <span class="color-cross">✗</span> = bit de contrôle échantillonné (identique / erreur), ' +
          '0 / 1 = conservé pour la clé, ? = bases différentes (écarté)',
        legendMismatch:
          'Clé : <span class="color-mismatch">rouge souligné</span> = le bit de Bob diffère de celui d\'Alice',
        photon: (p) => `Photon ${p.i}`,
        badCount: "Le nombre de photons doit être compris entre 20 et 500.",

        step1: "Étape 1 : Alice choisit ses filtres au hasard.",
        aliceFilters: (p) => `   Filtres d'Alice : ${p.list}`,
        step2: "Étape 2 : Alice choisit ses bits au hasard.",
        aliceBits: (p) => `   Bits d'Alice : ${p.list}`,
        step3: "Étape 3 : Alice encode ses bits en états quantiques.",
        aliceStates: (p) => `   États quantiques d'Alice : ${p.list}`,
        step4: "Étape 4 : Bob choisit ses filtres au hasard.",
        bobFilters: (p) => `   Filtres de Bob : ${p.list}`,
        step5: "Étape 5 : Eve intercepte des photons (si elle espionne).",
        eveProb: (p) => `   Probabilité d'interception : ${p.prob} %`,
        evePhoton: (p) => `   Photon ${p.i} : base d'Eve ${p.basis}` +
          (p.same ? " (la même qu'Alice)" : " (mauvaise base, résultat aléatoire)") +
          `, bit mesuré ${p.bit}, état réémis ${p.state}`,
        eveTotal: (p) => `   Nombre total de photons interceptés par Eve : ${p.count}`,
        eveOff: "   Eve n'est pas activée. Aucun photon intercepté.",
        step6: "Étape 6 : Bob mesure les photons reçus.",
        bobStates: (p) => `   États mesurés par Bob : ${p.list}`,
        step7: "Étape 7 : Alice et Bob comparent publiquement leurs filtres et gardent ceux qui coïncident.",
        common: (p) => `   Indices communs : ${p.list}`,
        step8: "Étape 8 : Choix d'un échantillon pour estimer le taux d'erreur.",
        sampled: (p) => `   Indices échantillonnés : ${p.list}`,
        noSample: "   Pas assez de filtres communs pour un échantillon significatif.",
        step9: "Étape 9 : Comparaison des bits de contrôle.",
        ctrlError: (p) => `   Erreur détectée au photon ${p.i}. (Alice=${p.a}, Bob=${p.b})`,
        ctrlOk: (p) => `   Pas d'erreur au photon ${p.i}. (Alice=${p.a}, Bob=${p.b})`,
        siftResults: (p) => `   Résultat du tamisage : ${p.list}`,
        step10: "Étape 10 : Calcul du taux d'erreur.",
        errorRate: (p) => `   Taux d'erreur : ${pct(p.rate)} (${p.errors}/${p.sample})`,
        step11: "Étape 11 : Évaluation de la confiance dans la liaison.",
        noCtrl: "   Aucun bit de contrôle : impossible de vérifier le canal. Échange abandonné.",
        abort: () => `   Taux d'erreur supérieur à ${pct(QBER_THRESHOLD, 0)} : espionnage suspecté. Échange abandonné.`,
        secureMsg: "   Taux d'erreur acceptable. Liaison considérée comme sûre.",
        step12: "Étape 12 : Génération de la clé secrète.",
        aliceKey: (p) => `   Clé d'Alice : ${p.key} (${p.len} bits)`,
        bobKey: (p) => `   Clé de Bob :  ${p.key} (${p.diff} bit(s) différent(s))`,
        noKey: "   Aucune clé générée.",
        completed: "Simulation terminée.",

        sPhotons: (r) => `Photons générés : ${r.n}`,
        sSifted: (r) => `Photons conservés après tamisage : ${r.sifted} (${pct(r.sifted/r.n)})`,
        sSample: (r) => `Bits de contrôle échantillonnés : ${r.sampleSize}`,
        sQber: (r) => `Taux d'erreur mesuré (QBER) : ${pct(r.errorRate)}`,
        sThreshold: () => `Seuil d'abandon : ${pct(QBER_THRESHOLD)}`,
        sIntercepted: (r) => `Photons interceptés par Eve : ${r.intercepted} (${pct(r.intercepted/r.n)})`,
        sExpected: (r) => `QBER attendu dû à Eve : ≈ ${pct(r.eveProb/4)}`,
        sAccepted: "Taux d'erreur acceptable : clé acceptée.",
        sRejected: "Taux d'erreur trop élevé : espionnage suspecté, clé rejetée.",

        kAborted: "Pas de clé : l'échange a été abandonné.",
        kLength: (r) => `Longueur : ${r.aliceKey.length} bits`,
        kAlice: "Alice :",
        kBob: "Bob :  ",
        kDiff: (r) => `Bits différents : ${r.keyMismatches}`,
        kDiffNote: " (à corriger par correction d'erreurs, puis amplification de confidentialité)",
        kEve: (r) => `Bits de la clé connus exactement par Eve : ${r.eveKnown} / ${r.aliceKey.length}`
      }
    };

    const LANG_STORAGE_KEY = "bb84-lang";
    let currentLang = "en";

    /**
     * Traduit une clé ; les entrées fonctions reçoivent `params`.
     */
    function t(key, params={}) {
      const entry = I18N[currentLang][key];
      return typeof entry === "function" ? entry(params) : entry;
    }

    /**
     * Formate un pourcentage selon la langue (5.0% / 5,0 %).
     */
    function pct(x, digits=1) {
      const s = (x*100).toFixed(digits);
      return currentLang === "fr" ? s.replace(".", ",") + " %" : s + "%";
    }

    function detectLanguage() {
      try {
        const saved = localStorage.getItem(LANG_STORAGE_KEY);
        if(saved && I18N[saved]) return saved;
      } catch(e) { /* stockage indisponible */ }
      const nav = (navigator.language || "").toLowerCase();
      return nav.startsWith("fr") ? "fr" : "en";
    }

    /**
     * Change la langue et retraduit tout ce qui est affiché,
     * y compris le résultat de la dernière simulation.
     */
    function setLanguage(lang) {
      currentLang = lang;
      try { localStorage.setItem(LANG_STORAGE_KEY, lang); } catch(e) { /* ignoré */ }

      document.documentElement.lang = lang;
      document.title = t("pageTitle");
      document.querySelectorAll("[data-i18n]").forEach(el => {
        el.textContent = t(el.dataset.i18n);
      });
      document.querySelectorAll("[data-i18n-html]").forEach(el => {
        el.innerHTML = t(el.dataset.i18nHtml);
      });
      document.querySelectorAll("#lang-switch button").forEach(btn => {
        btn.setAttribute("aria-pressed", String(btn.dataset.lang === lang));
      });

      eveProbLabel.textContent = pct(Number(eveProbInput.value) / 100, 0);
      document.querySelectorAll(".photon-box").forEach(box => {
        box.title = t("photon", {i: Number(box.dataset.index) + 1});
      });
      renderLog();
      if(lastResults) {
        updateStats(lastResults);
        updateKey(lastResults);
      }
    }

    /***************************************************
     * Configuration Variables and Objects
     ***************************************************/
    const POLARIZATIONS = {
      "Z0": "↑",   // 0°
      "Z1": "→",   // 90°
      "X0": "↗",   // 45°
      "X1": "↘"    // 135°
    };

    const COLORS = {
      "Z": "color-Z",
      "X": "color-X",
      "": "color-empty",
      "✓": "color-check",
      "✗": "color-cross"
    };

    // Above this QBER, Alice and Bob abort: no secure key can be distilled
    // (≈ 11% is the usual BB84 bound with one-way error correction).
    const QBER_THRESHOLD = 0.11;

    // Access DOM elements
    const nQubitsInput     = document.getElementById("nQubits");
    const eveActiveInput   = document.getElementById("eveActive");
    const eveProbContainer = document.getElementById("eveProbContainer");
    const eveProbInput     = document.getElementById("eveProb");
    const eveProbLabel     = document.getElementById("eveProbLabel");
    const startBtn         = document.getElementById("startBtn");

    const rowAliceContainer  = document.getElementById("rowAliceContainer");
    const rowEveContainer    = document.getElementById("rowEveContainer");
    const rowBobContainer    = document.getElementById("rowBobContainer");
    const rowCribleContainer = document.getElementById("rowCribleContainer");
    const rowKeyContainer    = document.getElementById("rowKeyContainer");

    const logDiv = document.getElementById("log");
    const statsDiv = document.getElementById("stats");
    const finalKeyDiv = document.getElementById("finalKey");
    const legendMismatchDiv = document.getElementById("legendMismatch");

    // Journal stocké sous forme de clés de traduction, pour pouvoir le
    // réafficher dans l'autre langue ; résultats de la dernière simulation.
    let logEntries = [];
    let lastResults = null;

    /***************************************************
     * Display Management
     ***************************************************/

    eveActiveInput.addEventListener("change", () => {
      eveProbContainer.hidden = !eveActiveInput.checked;
    });
    eveProbInput.addEventListener("input", () => {
      eveProbLabel.textContent = pct(Number(eveProbInput.value) / 100, 0);
    });

    /**
     * Affiche une entrée du journal à la fin de la console.
     */
    function appendLogLine(entry) {
      // Si c'est un séparateur, ajouter une ligne horizontale
      if(entry.separator) {
        logDiv.appendChild(document.createElement("hr"));
      }
      const line = document.createElement("div");
      line.textContent = entry.key ? t(entry.key, entry.params) : entry.text;
      // Les titres d'étape sont en gras
      if(entry.key && entry.key.startsWith("step")) {
        line.classList.add("log-step");
      }
      logDiv.appendChild(line);
    }

    function renderLog() {
      logDiv.innerHTML = "";
      logEntries.forEach(appendLogLine);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    /**
     * Ajoute un message traduisible à la zone "Console / Event Log".
     * @param {string} key Clé de traduction
     * @param {Object} params Paramètres du message
     * @param {boolean} separator Ligne horizontale avant le message
     */
    function insertLog(key, params={}, separator=false) {
      const entry = {key, params, separator};
      logEntries.push(entry);
      appendLogLine(entry);
      // Auto-scroll vers le bas
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    /**
     * Efface les conteneurs (Alice, Eve, Bob, Sifting, Key) et la console.
     */
    function clearDisplay() {
      rowAliceContainer.innerHTML  = "";
      rowEveContainer.innerHTML    = "";
      rowBobContainer.innerHTML    = "";
      rowCribleContainer.innerHTML = "";
      rowKeyContainer.innerHTML    = "";

      logEntries = [];
      lastResults = null;
      logDiv.innerHTML = "";
      statsDiv.textContent = "";
      statsDiv.className = "";
      finalKeyDiv.textContent = "";
      legendMismatchDiv.hidden = true;
    }

    /**
     * Met à jour graphiquement une ligne (par exemple, Alice, Bob, etc.) en affichant `bases[i]` et `states[i]`.
     * @param {HTMLElement} container L'élément .row-container où les photons sont placés
     * @param {string[]} bases Tableau des bases (par exemple, ["Z","X","Z",...])
     * @param {string[]} states Tableau des états (par exemple, ["↑","↘","✗","✓","0","1","?",...])
     * @param {Set<number>} highlightIndices Indices dont la base doit être en gras
     * @param {Object<number,string>} stateClasses Classe CSS imposée pour l'état de certains indices
     */
    function updateRow(container, bases, states, highlightIndices=null, stateClasses=null) {
      container.innerHTML = "";
      for(let i=0; i<bases.length; i++) {
        const base = bases[i] || "";
        const state = states[i] || "";

        // Couleur du deuxième label (état)
        let colorClass = COLORS[base] || "color-empty";
        if(state === "✓") colorClass = COLORS["✓"];
        if(state === "✗") colorClass = COLORS["✗"];
        if(stateClasses && stateClasses[i]) colorClass = stateClasses[i];

        const photonBox = document.createElement("div");
        photonBox.classList.add("photon-box");
        photonBox.dataset.index = i;
        photonBox.title = t("photon", {i: i+1});

        const basisLabel = document.createElement("div");
        basisLabel.classList.add("basis-label");
        // Si highlightIndices est défini et contient i => texte en gras
        if(highlightIndices && highlightIndices.has(i)) {
          basisLabel.style.fontWeight = "bold";
        }
        // Couleur de la base
        basisLabel.classList.add(COLORS[base] || "color-empty");
        // Espace insécable pour garder l'alignement des colonnes vides
        basisLabel.textContent = base || " ";

        const stateLabel = document.createElement("div");
        stateLabel.classList.add("state-label", colorClass);
        stateLabel.textContent = state || " ";

        photonBox.appendChild(basisLabel);
        photonBox.appendChild(stateLabel);
        container.appendChild(photonBox);
      }
    }

    /**
     * Met à jour la zone "Statistics".
     * @param {Object} r Résultats de la simulation
     */
    function updateStats(r) {
      const lines = [
        t("sPhotons", r),
        t("sSifted", r),
        t("sSample", r),
        t("sQber", r),
        t("sThreshold")
      ];
      if(r.eveActive) {
        lines.push("", t("sIntercepted", r), t("sExpected", r));
      }
      lines.push("", t(r.secure ? "sAccepted" : "sRejected"));

      statsDiv.textContent = lines.join("\n");
      statsDiv.className = r.secure ? "stats-ok" : "stats-alert";
    }

    /**
     * Met à jour la zone "Final Key".
     * @param {Object} r Résultats de la simulation
     */
    function updateKey(r) {
      legendMismatchDiv.hidden = !(r.secure && r.keyMismatches > 0);
      if(!r.secure) {
        finalKeyDiv.textContent = t("kAborted");
        return;
      }
      let text =
        t("kLength", r) + "\n\n" +
        t("kAlice") + " " + r.aliceKey.join("") + "\n" +
        t("kBob") + " " + r.bobKey.join("") + "\n\n" +
        t("kDiff", r);
      if(r.keyMismatches > 0) {
        text += t("kDiffNote");
      }
      if(r.eveActive) {
        text += "\n" + t("kEve", r);
      }
      finalKeyDiv.textContent = text;
    }

    /**
     * Convertit un symbole (↑, →, ↗, ↘) en bit (0 ou 1) basé sur la base.
     * @param {string} symbol  Ex: "↑"
     * @param {string} basis   Ex: "Z" ou "X"
     * @returns {number|null}  0, 1, ou null si indéfini
     */
    function symbolToBit(symbol, basis) {
      if(basis === "Z") {
        if(symbol === "↑") return 0;
        if(symbol === "→") return 1;
      }
      if(basis === "X") {
        if(symbol === "↗") return 0;
        if(symbol === "↘") return 1;
      }
      return null;
    }

    /**
     * Mesure d'un photon polarisé `state` (préparé dans la base `stateBasis`)
     * avec un filtre de base `measureBasis`.
     * Même base : résultat certain. Base différente : résultat aléatoire (50/50).
     * @returns {number} bit mesuré
     */
    function measure(state, stateBasis, measureBasis) {
      if(stateBasis === measureBasis) {
        return symbolToBit(state, stateBasis);
      }
      return randomBit();
    }

    /**
     * Fonction utilitaire pour obtenir un entier aléatoire dans [0, max).
     */
    function randInt(max) {
      return Math.floor(Math.random() * max);
    }

    function randomBit() {
      return randInt(2);
    }

    function randomBasis() {
      return randomBit() === 0 ? "Z" : "X";
    }

    /**
     * Mélange de Fisher-Yates (pour mélanger un tableau).
     * Retourne un nouveau tableau mélangé.
     */
    function shuffleArray(array) {
      let arr = array.slice(); // copie
      for (let i = arr.length - 1; i > 0; i--) {
          const j = randInt(i + 1);
          [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    /**
     * Retourne un échantillon de taille `k` à partir du tableau `arr` (sans répétition).
     * Si k > arr.length, il est limité à arr.length.
     */
    function sampleArray(arr, k) {
      const shuffled = shuffleArray(arr);
      return shuffled.slice(0, Math.min(k, arr.length));
    }

    /**
     * Démarre la simulation complète.
     */
    function startSimulation() {
      // Récupère le nombre de photons
      let n = parseInt(nQubitsInput.value, 10);
      if(isNaN(n) || n < 20 || n > 500) {
        alert(t("badCount"));
        return;
      }

      // Efface l'affichage précédent
      clearDisplay();

      const log = insertLog;
      const list = (arr) => ({list: arr.join(", ")});
      const oneBased = (arr) => arr.map(i => i+1);

      const isEveActive = eveActiveInput.checked;
      const eveInterceptProb = isEveActive ? Number(eveProbInput.value) / 100 : 0;

      // Step 1: Alice choisit aléatoirement des filtres
      log("step1", {}, true);
      const alice_bases = Array.from({length: n}, randomBasis);
      log("aliceFilters", list(alice_bases));

      // Step 2: Alice choisit aléatoirement des bits
      log("step2");
      const alice_bits = Array.from({length: n}, randomBit);
      log("aliceBits", list(alice_bits));

      // Step 3: Alice encode et envoie les photons
      log("step3");
      const alice_states = alice_bits.map((bit, i) => POLARIZATIONS[alice_bases[i] + bit]);
      log("aliceStates", list(alice_states));

      // Step 4: Bob choisit aléatoirement des filtres
      log("step4");
      const bob_bases = Array.from({length: n}, randomBasis);
      log("bobFilters", list(bob_bases));

      // Step 5: Eve peut intercepter les photons (intercept-resend)
      log("step5");
      const received_bases = alice_bases.slice();
      const received_states = alice_states.slice();

      // Colonnes vides pour les photons qu'Eve laisse passer
      const eve_bases  = new Array(n).fill("");
      const eve_states = new Array(n).fill("");
      const eve_bits   = new Array(n).fill(null);
      let intercept_count = 0;

      if(isEveActive) {
        log("eveProb", {prob: Math.round(eveInterceptProb*100)});
        for(let i=0; i<n; i++) {
          if(Math.random() >= eveInterceptProb) continue;
          intercept_count++;

          // Eve ne connaît pas la base d'Alice : elle en choisit une au hasard
          // et mesure. Si elle se trompe de base, son résultat est aléatoire.
          const eve_basis = randomBasis();
          const eve_bit = measure(alice_states[i], alice_bases[i], eve_basis);
          const eve_state = POLARIZATIONS[eve_basis + eve_bit];

          eve_bases[i] = eve_basis;
          eve_bits[i] = eve_bit;
          eve_states[i] = eve_state;

          log("evePhoton", {i: i+1, basis: eve_basis, same: eve_basis === alice_bases[i],
                            bit: eve_bit, state: eve_state});

          // Bob reçoit le photon réémis par Eve
          received_bases[i] = eve_basis;
          received_states[i] = eve_state;
        }
        log("eveTotal", {count: intercept_count});
      } else {
        log("eveOff");
      }
      updateRow(rowEveContainer, isEveActive ? eve_bases : [], eve_states);

      // Step 6: Bob mesure les photons reçus avec ses filtres
      log("step6");
      const bob_bits = bob_bases.map((basis, i) => measure(received_states[i], received_bases[i], basis));
      const bob_states = bob_bits.map((bit, i) => POLARIZATIONS[bob_bases[i] + bit]);
      log("bobStates", list(bob_states));

      // Step 7: Découverte des filtres communs (échange public des bases)
      log("step7");
      const sifted_indices = [];
      for(let i=0; i<n; i++) {
        if(alice_bases[i] === bob_bases[i]) {
          sifted_indices.push(i);
        }
      }
      const siftedSet = new Set(sifted_indices);
      log("common", list(oneBased(sifted_indices)));

      // Mettre en gras les indices communs
      updateRow(rowAliceContainer, alice_bases, alice_states, siftedSet);
      updateRow(rowBobContainer, bob_bases, bob_states, siftedSet);

      // Step 8: Sélection d'un échantillon pour tester l'erreur
      log("step8");
      const sample_size = Math.max(3, Math.floor(sifted_indices.length / 2));
      let sample_indices = [];
      if(sifted_indices.length >= sample_size) {
        sample_indices = sampleArray(sifted_indices, sample_size).sort((a, b) => a - b);
        log("sampled", list(oneBased(sample_indices)));
      } else {
        log("noSample");
      }
      const sampleSet = new Set(sample_indices);

      // Step 9: Comparaison publique des bits de contrôle
      log("step9");
      let error_count = 0;

      const sifting_bases  = new Array(n).fill("");
      const sifting_states = new Array(n).fill("?");

      for(let i of sifted_indices) {
        sifting_bases[i] = alice_bases[i];
        if(sampleSet.has(i)) {
          // Bit de contrôle (révélé publiquement, donc sacrifié)
          const alice_bit = alice_bits[i];
          const bob_bit = bob_bits[i];
          if(alice_bit !== bob_bit) {
            sifting_states[i] = "✗";
            error_count++;
            log("ctrlError", {i: i+1, a: alice_bit, b: bob_bit});
          } else {
            sifting_states[i] = "✓";
            log("ctrlOk", {i: i+1, a: alice_bit, b: bob_bit});
          }
        } else {
          // Bit utile (clé future)
          sifting_states[i] = alice_bits[i].toString();
        }
      }

      log("siftResults", list(sifting_states));
      updateRow(rowCribleContainer, sifting_bases, sifting_states);

      // Step 10: Calcul du taux d'erreur
      log("step10");
      const errorRate = sample_indices.length > 0 ? error_count / sample_indices.length : 0;
      log("errorRate", {rate: errorRate, errors: error_count, sample: sample_indices.length});

      // Step 11: Évaluation de la confiance de la connexion
      log("step11");
      const secure = sample_indices.length > 0 && errorRate <= QBER_THRESHOLD;
      if(sample_indices.length === 0) {
        log("noCtrl");
      } else if(!secure) {
        log("abort");
      } else {
        log("secureMsg");
      }

      // Step 12: Formation de la clé secrète (bits communs non révélés)
      log("step12");
      const key_indices = secure ? sifted_indices.filter(i => !sampleSet.has(i)) : [];
      const key_states = new Array(n).fill("");
      const mismatchClasses = {};
      const aliceKey = [], bobKey = [];
      let keyMismatches = 0, eveKnown = 0;
      for(let i of key_indices) {
        key_states[i] = alice_bits[i].toString();
        aliceKey.push(alice_bits[i]);
        bobKey.push(bob_bits[i]);
        if(alice_bits[i] !== bob_bits[i]) {
          keyMismatches++;
          mismatchClasses[i] = "color-mismatch";
        }
        if(eve_bits[i] === alice_bits[i] && eve_bases[i] === alice_bases[i]) {
          eveKnown++;
        }
      }
      if(secure) {
        log("aliceKey", {key: aliceKey.join(""), len: aliceKey.length});
        log("bobKey", {key: bobKey.join(""), diff: keyMismatches});
      } else {
        log("noKey");
      }

      // Met à jour la ligne "Key"
      updateRow(rowKeyContainer, new Array(n).fill(""), key_states, null, mismatchClasses);

      // Met à jour les panneaux droits
      lastResults = {
        n, sifted: sifted_indices.length, sampleSize: sample_indices.length,
        errorRate, secure, eveActive: isEveActive, eveProb: eveInterceptProb,
        intercepted: intercept_count, aliceKey, bobKey, keyMismatches, eveKnown
      };
      updateStats(lastResults);
      updateKey(lastResults);

      logEntries.push({text: "--------------------------------------------------"});
      appendLogLine(logEntries[logEntries.length - 1]);
      log("completed", {}, true);
    }

    /***************************************************
     * Events
     ***************************************************/
    startBtn.addEventListener("click", startSimulation);
    document.querySelectorAll("#lang-switch button").forEach(btn => {
      btn.addEventListener("click", () => setLanguage(btn.dataset.lang));
    });

    setLanguage(detectLanguage());

  </script>
</body>
</html>
